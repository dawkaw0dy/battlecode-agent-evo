seed = 21376769            # master seed; every random choice derives from it
population = 8             # n (M5: owner, 2026-10-23)
keep_fraction = 0.1        # k; survivors s = max(2, ceil(n*k))
elites = 1                 # top bots carried over frozen, no new session
immigrants = 2             # fresh agents from an archetype per generation (run 2: owner, 2026-10-24)
language = "cpp"           # only C++ is admitted (§8)

[agents]
max_parallel = 7           # cloud sessions running at once (D37: a whole generation after gen 0 in one wave)
require_approval = false   # D37: owner chose to run unattended; max_sessions_total is the hard stop (§0.4)
max_sessions_total = 110   # hard cap on cloud sessions for the whole run (run 2: 8 + 14 generations x 7 = 106)
deadline_minutes = 120     # no DONE marker by then -> slot is dead; gen 0 gets 1.5x; nudge at -20 min (run 2, D40)
relaunch_dead = 0          # relaunch attempts per dead slot per generation (M4: owner)
local_game_budget = 900    # games an agent may play while developing (D32; run 2: owner, 2026-10-24)

[eval]
runner_version = "cambc==3.0.5"    # pinned in M0 (M0.md item 1); keep equal to VER in evo/env/setup.sh
map_pool = "maps"                  # the M maps `cambc init` downloaded (§1.1)
heldout_pool = "dawkaw0dy/battlecode-agent-evo-heldout"   # private repo, cloned at heldout/ (§9.4, D33)
heldout_stage_b = 16               # held-out maps per generation in Stage B; the rest are kept for Stage C (D33)
panel = ["starter"]                # fixed opponents; plus hall of fame below
hall_of_fame_in_panel = 3          # until 2 exist, Stage A is a round robin (§11)
stage_a_maps = 16                  # rotating subset, chosen by generation seed
stage_b_top = 4                    # bots promoted to the full round robin
shard_games = 200                  # games per matrix job (D21)
jobs_per_runner = 0                # 0 = nproc
spotcheck_fraction = 0.02
spotcheck_min = 4
spotcheck_where = "actions"         # D35: replay the sample on Actions; "local" replays on this PC
spotcheck_runs_on = "ubuntu-22.04"  # D35: a different image from the shards' ubuntu-latest
max_fault_rate = 0.10              # above this a bot is disqualified
exceptions_disqualify = false      # D29: caught exceptions are losses but do not count towards max_fault_rate

[mutation]
operator_weights = { tweak = 0.40, subsystem = 0.30, crossover = 0.20, radical = 0.10 }
focus = ["camps", "combat", "spells", "pathing", "opening", "endgame", "defense", "fuel", "map-adaptive"]
evidence_losses = 3
immigrant_base = "starter"         # or "hall_of_fame" from generation 2 (§13.4)

[run]
max_generations = 15       # run 2: generations 00-14, then pause
# D39: run 2, a fresh start. Run 1 (e/g ids) stays in evo/state.json, evo/lineage.jsonl, evo/cache.jsonl.
id_prefix = "f"             # agents fGG-SS
job_prefix = "r"            # jobs rGG-A
state = "evo/run2/state.json"
lineage = "evo/run2/lineage.jsonl"
cache = "evo/run2/cache.jsonl"
