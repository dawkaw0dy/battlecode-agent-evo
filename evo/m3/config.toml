# M3 done-test run (PLAN §16 M3): 2 real cloud agents complete their tasks and are admitted.
# Real launcher and prompts; separate ids and files (agents r00-SS, jobs rg00-A, state under evo/m3/).
# With 2 bots the generation stops after admission ("too small to select"), which is the M3 goal.
seed = 20261022
population = 2
keep_fraction = 0.25
elites = 0
immigrants = 2
language = "cpp"

[run]
id_prefix = "r"
job_prefix = "rg"
state = "evo/m3/state.json"
lineage = "evo/m3/lineage.jsonl"
cache = "evo/m3/cache.jsonl"
archetypes_dir = "evo/prompts/archetypes"
launcher = "cloud"
max_generations = 1

[agents]
max_parallel = 2
require_approval = true
max_sessions_total = 2       # hard cap: exactly the two approved sessions, no relaunch
deadline_minutes = 30        # generation 0 gets 1.5x = 45 minutes (owner, 2026-10-22)
relaunch_dead = 0
local_game_budget = 120

[eval]
runner_version = "cambc==3.0.5"
map_pool = "maps"
heldout_pool = ""
panel = ["starter"]
hall_of_fame_in_panel = 3
stage_a_maps = 16
stage_b_top = 4
shard_games = 200
jobs_per_runner = 0
spotcheck_fraction = 0.02
spotcheck_min = 4
max_fault_rate = 0.10

[mutation]
operator_weights = { tweak = 0.40, subsystem = 0.30, crossover = 0.20, radical = 0.10 }
focus = ["camps", "combat", "spells", "pathing", "opening", "endgame", "defense", "fuel", "map-adaptive"]
evidence_losses = 3
immigrant_base = "starter"
