# Runs the cloud environment's setup script and SessionStart check on a plain
# Ubuntu runner (PLAN §0.5), so they can be tested without a cloud session.
name: evo-env-test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['evo/env/**', '.github/workflows/evo-env-test.yml']
permissions: { contents: read }
concurrency: { group: evo-env-test, cancel-in-progress: false }

jobs:
  env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Setup script
        run: |
          sudo mkdir -p /opt/cambc-ref && sudo chown "$USER" /opt/cambc-ref
          start=$(date +%s)
          bash evo/env/setup.sh
          echo "setup seconds: $(( $(date +%s) - start ))"
      - name: SessionStart check
        env: { EVO_FORCE_CHECK: '1' }
        run: |
          start=$(date +%s)
          bash evo/env/check.sh
          echo "check seconds: $(( $(date +%s) - start ))"

  # Closer to the cloud VM: root, system Python on Ubuntu 24.04 (PEP 668), and cambc's own
  # downloads blocked (in the cloud its TLS proxy breaks them; M0 item 11). Python downloads still work.
  env-root-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:24.04
    steps:
      - name: Base packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 python3-pip nodejs ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - name: Shim that breaks cambc's network access
        run: |
          {
            echo '#!/bin/sh'
            echo 'export HTTPS_PROXY=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9'
            echo 'exec /usr/local/bin/cambc "$@"'
          } > /usr/local/sbin/cambc
          chmod +x /usr/local/sbin/cambc
      - name: Setup script (as root)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          start=$(date +%s)
          bash evo/env/setup.sh
          echo "setup seconds: $(( $(date +%s) - start ))"
      - name: SessionStart check (as root)
        env: { EVO_FORCE_CHECK: '1' }
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash evo/env/check.sh
      - name: Cache listing and setup log
        if: always()
        run: |
          ls -la ~/.cache/cambc || true
          cat /opt/evo-setup.log || true
          # Job logs need a token to download; annotations are public, so surface the tail there.
          tail -n 30 /opt/evo-setup.log 2>/dev/null | python3 -c 'import sys; print("::error title=setup log tail::" + sys.stdin.read().replace("%", "%25").replace("\r", "").replace("\n", "%0A"))' || true
      - name: Debug - what does cambc itself install?
        if: failure()
        run: |
          annotate() { python3 -c 'import sys; t=sys.argv[1]; print("::warning title=" + t + "::" + sys.stdin.read()[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A"))' "$1"; }
          C="${XDG_CACHE_HOME:-$HOME/.cache}/cambc"
          { echo "HOME=$HOME XDG_CACHE_HOME=${XDG_CACHE_HOME:-} id=$(id -un) getent=$(getent passwd "$(id -un)" | cut -d: -f6)"
            find "$C" -maxdepth 2 | sort | head -40; } 2>&1 | annotate "seeded cache"
          mv "$C" "$C.seeded"; mkdir -p /tmp/real && cd /tmp/real
          env -u CAMBC_OFFLINE /usr/local/bin/cambc init --yes . </dev/null > /tmp/real.log 2>&1 || true
          { tail -5 /tmp/real.log; find "$C" -maxdepth 2 | sort | head -40; find / -maxdepth 4 -name 'cmake-3.31*' -not -path '/proc/*' 2>/dev/null | head; } 2>&1 | annotate "cambc's own cache"
          { diff <(cd "$C.seeded" && find . -maxdepth 3 | sort) <(cd "$C" && find . -maxdepth 3 | sort) | head -60; } 2>&1 | annotate "diff seeded vs real (depth 3)"
