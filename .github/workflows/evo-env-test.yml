# Runs the cloud environment's setup script and SessionStart check on a plain
# Ubuntu runner (PLAN §0.5), so they can be tested without a cloud session.
name: evo-env-test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['evo/env/**', '.github/workflows/evo-env-test.yml']
permissions: { contents: read }
concurrency: { group: evo-env-test, cancel-in-progress: false }

jobs:
  env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Setup script
        run: |
          sudo mkdir -p /opt/cambc-ref && sudo chown "$USER" /opt/cambc-ref
          start=$(date +%s)
          bash evo/env/setup.sh
          echo "setup seconds: $(( $(date +%s) - start ))"
      - name: SessionStart check
        env: { EVO_FORCE_CHECK: '1' }
        run: |
          start=$(date +%s)
          bash evo/env/check.sh
          echo "check seconds: $(( $(date +%s) - start ))"

  # Closer to the cloud VM: root, system Python on Ubuntu 24.04 (PEP 668), and cambc's own
  # downloads blocked (in the cloud its TLS proxy breaks them; M0 item 11). Python downloads still work.
  env-root-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:24.04
    steps:
      - name: Base packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 python3-pip nodejs ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - name: Shim that breaks cambc's network access
        run: |
          {
            echo '#!/bin/sh'
            echo 'export HTTPS_PROXY=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9'
            echo 'exec /usr/local/bin/cambc "$@"'
          } > /usr/local/sbin/cambc
          chmod +x /usr/local/sbin/cambc
      - name: Setup script (as root)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          start=$(date +%s)
          bash evo/env/setup.sh
          echo "setup seconds: $(( $(date +%s) - start ))"
      - name: SessionStart check (as root)
        env: { EVO_FORCE_CHECK: '1' }
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash evo/env/check.sh
      - name: Cache listing and setup log
        if: always()
        run: |
          ls -la ~/.cache/cambc || true
          cat /opt/evo-setup.log || true
          # Job logs need a token to download; annotations are public, so surface the tail there.
          tail -n 30 /opt/evo-setup.log 2>/dev/null | python3 evo/m0/annotate.py 'setup log tail' error || true
      - name: Debug - which cmake does cambc try to run?
        if: failure()
        run: |
          annotate() { python3 "$GITHUB_WORKSPACE/evo/m0/annotate.py" "$1"; }
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq strace >/dev/null
          mkdir -p /tmp/t1 && cd /tmp/t1
          CAMBC_OFFLINE=1 strace -f -e trace=execve,execveat -o /tmp/t1.strace /usr/local/bin/cambc init --yes . </dev/null > /tmp/t1.log 2>&1 || true
          { tail -3 /tmp/t1.log; grep -E 'execve' /tmp/t1.strace | grep -v 'resumed' | cut -c1-300 | head -25; } 2>&1 | annotate "T1 offline, real network: execve"
          mkdir -p /tmp/t2 && cd /tmp/t2
          env -u CAMBC_OFFLINE strace -f -e trace=execve,execveat -o /tmp/t2.strace /usr/local/bin/cambc init --yes . </dev/null > /tmp/t2.log 2>&1 || true
          { tail -3 /tmp/t2.log; grep -E 'execve' /tmp/t2.strace | grep -v 'resumed' | cut -c1-300 | head -25; } 2>&1 | annotate "T2 online: execve"
